services:
  db:
    image: postgres:17-alpine
    container_name: gamevault-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: gamevault
      POSTGRES_USER: gamevault
      POSTGRES_PASSWORD: DEIN_SICHERES_PASSWORT

    volumes:
      - /volume1/docker/gamevault/postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamevault -d gamevault"]
      interval: 10s
      timeout: 5s
      retries: 10


  gamevault:
    image: ghcr.io/domhit/gamevault:latest
    container_name: gamevault
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      DATA_DIR: /data
      METADATA_TIMEOUT: 20
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      DATABASE_URL: postgresql+psycopg://gamevault:DEIN_SICHERES_PASSWORT@db:5432/gamevault

    volumes:
      - /volume1/docker/gamevault/data:/data
